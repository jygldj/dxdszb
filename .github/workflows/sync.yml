name: Sync Live Sources

on:
  schedule:
    # 每 12 小时运行一次（北京时间 08:00 / 20:00）
    - cron: '0 */12 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    # ★ 上游地址与判定阈值集中在这里，换源只改这一处
    env:
      # 2026-10-08 换源：裤佬 live.445569.xyz 域名已 DNS 失效，改用 iTCoffe 聚合源
      URL_LIVE: https://raw.githubusercontent.com/iTCoffe/Collect-iTV/main/Internet_iTV.m3u
      URL_DXDS: http://rihou.cc:555/gggg.nzk       # 日后源（2026-10 起全端口不通，暂留待换）
      MIN_LIVE_CHANNELS: 500   # 有效直播源最少频道数（iTCoffe 正常 2200+），低于此视为上游异常
      MIN_DXDS_LINES: 100      # 有效节目单最少行数（正常 1600+），防止上游缩水/返回错误页
      STALE_DAYS: 3            # 超过 N 天没实质更新 → 运行摘要告警（GitHub 会发邮件给仓库主）
      RETRY: 3
      DELAY: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync live.m3u (裤佬)
        id: sync_live
        run: |
          set -e
          URL="${URL_LIVE}"
          OUTPUT="live.m3u"
          BACKUP="${OUTPUT}.bak"
          RETRY=3
          DELAY=5
          
          # 备份当前文件
          if [ -f "$OUTPUT" ]; then
            cp "$OUTPUT" "$BACKUP"
          fi
          
          # 带重试的下载
          for i in $(seq 1 $RETRY); do
            echo "Attempt $i to download $URL..."
            if curl -sSL --connect-timeout 30 --max-time 60 "$URL" -o "$OUTPUT.tmp"; then
              # 校验是否为有效 M3U（含 #EXTM3U）
              if grep -q "^#EXTM3U" "$OUTPUT.tmp" 2>/dev/null; then
                # 有效性校验：光有 #EXTM3U 头不够，频道数必须达标（防上游返回空壳列表）
                NCH=$(grep -c '^#EXTINF' "$OUTPUT.tmp" || true)
                if [ "${NCH:-0}" -lt "${MIN_LIVE_CHANNELS}" ]; then
                  echo "Invalid M3U: 频道数 $NCH < ${MIN_LIVE_CHANNELS}，视为上游异常，重试…"
                  rm -f "$OUTPUT.tmp"
                  if [ $i -lt $RETRY ]; then sleep $DELAY; fi
                  continue
                fi
                echo "Valid M3U file downloaded ($NCH 频道)."
                
                # 剔除指定分组：TG频道@stymei、抖音、快手
                awk '
                  BEGIN { skip=0; }
                  /^#EXTINF:/ {
                    if ($0 ~ /group-title="[^"]*TG频道@stymei[^"]*"/ || \
                        $0 ~ /group-title="[^"]*抖音[^"]*"/ || \
                        $0 ~ /group-title="[^"]*快手[^"]*"/) {
                      skip=1;
                    } else {
                      skip=0;
                      print;
                    }
                    next;
                  }
                  !skip { print; }
                ' "$OUTPUT.tmp" > "$OUTPUT.new"

                # 注入 EPG 头（x-tvg-url，TVBox/酷9 认此属性；覆盖上游原头）
                { printf '#EXTM3U x-tvg-url="https://dx-epg.pages.dev/epg.gz"\n'; tail -n +2 "$OUTPUT.new"; } > "$OUTPUT.tmp2" && mv "$OUTPUT.tmp2" "$OUTPUT.new"

                if [ -s "$OUTPUT.new" ]; then
                  mv "$OUTPUT.new" "$OUTPUT"
                  # 图床回退：上游 epg.112114.xyz 已宕机；fanmingming.cn 实测不可达(HTTP 000)，改用 dxtv.m3u 同款 gitee myTVlogo（OK影视已验证出图, HTTP 200）
                  sed -i 's#epg\.112114\.xyz/logo/#gitee.com/mytv-android/myTVlogo/raw/main/img/#g' "$OUTPUT"
                  # 剥离 gitee 台标文件名里的 URL 编码中文后缀(如 CCTV1综合.png -> CCTV1.png)，适配 myTVlogo 裸名库；纯全名频道(动漫/日语等) gitee 本无图, 保持不动
                  sed -i -E 's#(gitee\.com/mytv-android/myTVlogo/raw/main/img/[^%]+)%[0-9A-Fa-f]{2}(%[0-9A-Fa-f]{2})*\.png#\1.png#g' "$OUTPUT"
                  echo "Filtered M3U saved to $OUTPUT"
                  echo "changed=true" >> $GITHUB_OUTPUT
                  rm -f "$OUTPUT.tmp" "$BACKUP"
                  # 最佳努力：用 dx-epg 的 XMLTV 对齐频道 id（失败不阻断）
                  if curl -sSL --max-time 60 "https://dx-epg.pages.dev/epg.xml.gz" -o /tmp/epg_align.xml.gz 2>/dev/null; then
                    if gunzip -f /tmp/epg_align.xml.gz 2>/dev/null; then
                      python3 align_m3u.py --xml /tmp/epg_align.xml --m3u "$OUTPUT" && \
                        echo "::notice::live.m3u 频道 id 已对齐 EPG" || echo "::warning::id 对齐失败，保留原 id"
                    else
                      echo "::warning::epg.xml 解压失败，跳过 id 对齐"
                    fi
                  else
                    echo "::warning::epg.xml 下载失败，跳过 id 对齐"
                  fi
                  exit 0
                else
                  echo "Filtered file is empty, aborting..."
                  rm -f "$OUTPUT.new"
                fi
              else
                echo "Invalid M3U: missing #EXTM3U header"
              fi
            fi
            
            # 重试等待
            if [ $i -lt $RETRY ]; then
              echo "Waiting $DELAY seconds before retry..."
              sleep $DELAY
            fi
          done
          
          # 所有重试失败，恢复备份
          if [ -f "$BACKUP" ]; then
            echo "All attempts failed, restoring backup."
            mv "$BACKUP" "$OUTPUT"
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "No backup available, sync failed."
            exit 1
          fi
        env:
          RETRY: 3
          DELAY: 5

      - name: Sync dxds.txt (日后)
        id: sync_dxds
        run: |
          set -e
          URL="${URL_DXDS}"
          OUTPUT="dxds.txt"
          BACKUP="${OUTPUT}.bak"
          RETRY=3
          DELAY=5
          
          # 备份当前文件
          if [ -f "$OUTPUT" ]; then
            cp "$OUTPUT" "$BACKUP"
          fi
          
          # 带重试的下载
          for i in $(seq 1 $RETRY); do
            echo "Attempt $i to download $URL..."
            if curl -sSL --connect-timeout 30 --max-time 60 "$URL" -o "$OUTPUT.tmp"; then
              # 校验非空
              if [ -s "$OUTPUT.tmp" ] && grep -q "[^[:space:]]" "$OUTPUT.tmp"; then
                # 内容形态校验（血泪教训：上游曾返回 nginx 500 页面，旧逻辑"只判非空"
                # 就放行，把 1644 行节目单一夜覆盖成 7 行错误页 —— 故必须校验特征）
                NBAD=$(grep -c -i -e "<html" -e "Internal Server Error" -e "Bad Gateway" -e "Not Found" "$OUTPUT.tmp" || true)
                NGEN=$(grep -c "#genre#" "$OUTPUT.tmp" || true)
                NLIN=$(grep -c "" "$OUTPUT.tmp" || true)
                if [ "${NBAD:-0}" -gt 0 ]; then
                  echo "Invalid dxds: 疑似 HTML 错误页（命中 $NBAD 行），重试…"
                elif [ "${NGEN:-1}" -lt 1 ]; then
                  echo "Invalid dxds: 无 #genre# 分组标记，不像 TVBox 节目单，重试…"
                elif [ "${NLIN:-0}" -lt "${MIN_DXDS_LINES}" ]; then
                  echo "Invalid dxds: 仅 $NLIN 行 < ${MIN_DXDS_LINES}，疑似上游缩水，重试…"
                else
                  echo "Valid dxds: $NLIN 行 / $NGEN 个分组"
                  mv "$OUTPUT.tmp" "$OUTPUT"
                  echo "dxds.txt saved to $OUTPUT"
                  echo "changed=true" >> $GITHUB_OUTPUT
                  rm -f "$BACKUP"
                  exit 0
                fi
              else
                echo "Downloaded file is empty."
              fi
            fi
            
            # 重试等待
            if [ $i -lt $RETRY ]; then
              echo "Waiting $DELAY seconds before retry..."
              sleep $DELAY
            fi
          done
          
          # 所有重试失败，恢复备份
          if [ -f "$BACKUP" ]; then
            echo "All attempts failed, restoring backup."
            mv "$BACKUP" "$OUTPUT"
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "No backup available, sync failed."
            exit 1
          fi
        env:
          RETRY: 3
          DELAY: 5

      - name: 同步结果摘要 + 陈旧告警
        if: always()
        run: |
          {
            echo "## 📡 直播源同步结果"
            echo ""
            echo "| 文件 | 大小 | 频道/行数 | 最近实质更新 |"
            echo "|---|---|---|---|"
          } >> $GITHUB_STEP_SUMMARY
          for f in live.m3u dxds.txt; do
            [ -f "$f" ] || continue
            sz=$(wc -c < "$f")
            if [ "$f" = "live.m3u" ]; then
              cnt=$(grep -c '^#EXTINF' "$f" || true)
            else
              cnt=$(grep -c '' "$f" || true)
            fi
            last=$(git log -1 --date=short --format='%ad' -- "$f" 2>/dev/null || echo '未知')
            echo "| $f | $sz B | $cnt | $last |" >> $GITHUB_STEP_SUMMARY
            # 陈旧判定：超过 STALE_DAYS 天没实质更新就告警（GitHub 会邮件通知仓库主）
            ts=$(git log -1 --format=%ct -- "$f" 2>/dev/null || echo 0)
            days=$(( ($(date +%s) - ${ts:-0}) / 86400 ))
            if [ "$days" -ge "${STALE_DAYS}" ]; then
              echo "::warning::$f 已 $days 天没有实质更新（阈值 ${STALE_DAYS} 天），上游很可能已失效"
            fi
          done

      - name: Commit and push changes
        if: steps.sync_live.outputs.changed == 'true' || steps.sync_dxds.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add live.m3u dxds.txt
          
          # 检查是否有变更
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          
          git commit -m "chore: auto sync live sources"
          git push