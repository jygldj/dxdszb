name: CCTV Live (央视频签名源)

# 【为什么每小时跑一次】
# 央视频返回 vkey_renew_interval = 14400（4 小时），即固化 URL 最多活 4 小时。
# GitHub Actions 的 cron 分钟字段只能取 0-59，无法直接表达 90 分钟，
# 故取每小时一次（第 23 分，错开整点避开与其他 workflow 撞车）——
# 远小于 4 小时寿命，留足 4 倍余量，确保主公任何时刻打开看到的都是有效 URL。
#
# 【清晰度：只签高清】
# 主公军令（2026-10-24）：只请求高清，不要标清及以下。
# 故 defn 输入项只提供 fhd（高清1080P）与 uhd（超高清，仅4K频道有效），
# 脚本内部亦已掐断 shd/hd 回退链——单个频道最多签 2 次，绝不向下凑档。
#
# 【V6 更正 · 2026-10-25 · 推翻 V5 的「节点质量」结论】
#   2026-10-25 全天实测（主公连续实测 + 6 组对照实验）把 403 机制彻底定性：
#     · 403 由**源站授权闸门**产生，不在边缘缓存
#       （X-Cache: MISS、X-Swift-Error: orig response 4XX error、Via: ens-cache*）；
#     · 取流额度按 **(token × host)** 计：同一 token 在 host A 首次 200，
#       再取 host A 必 403；**换到 host B 仍 200**；
#     · 叠加**频道级突发保护**：同频道 2.4s 内猛打 6 次 → 连兄弟 token 一起封；
#     · 同 IP 同 token 冷却 80s 仍 403，**10 分钟后**才恢复；
#     · 正常播放（列表+分片）连取 15 次全 200 → 被烧的是「只拉列表」这种**探测**行为。
#   ⇒ **根因是 V5 脚本自己把额度烧穿了**：`sign_channels()` 对每条线调 `Y.verify()`
#     （列表+分片+再列表 = 3 次取流），线路1 更被验 2 轮（= 6 次）。
#     且实测「线路顺序 = 签发顺序」（三线 svrtime 非递减 100%），
#     线路1 验得最多、烧得最狠 → 正是主公实测「留活频道线路1 全死、线路2 全活」的机制。
#   ⇒ **V6 三案（主公 2026-10-25 定夺：甲+乙+丙）**：
#     甲 **签发与验活彻底分离** —— 主流程一次都不碰 CDN，
#        `--sample` 体检改用**独立的一次性 token**（测完即弃），不碰要发布的 token；
#     乙 **写盘顺序反转** —— 最后签发（最新鲜）的 token 放线路1（播放器优先试线路1）；
#     丙 **--repeat 由 3 降为 2** —— 同频道 3 条线会互争该频道额度，2 条为平衡点。
#
# 【V6 附带订正 · host × cdn】
#   签发侧静态分析实测：host 与 `cdn` query **成对下发**（dtocnc↔5505、hlsliveali↔5506），
#   但对照实验测了 host×cdn 四种组合**全部 200** ⇒ `cdn` 不参与路由校验。
#   V5 把所有线路强制换到 `hlsliveali-cdn`（V5 误以为 dtocnc 0% 可用，
#   实际那批「全灭」样本取到的是 **ACL 403 页** = 海外出口被拦，不是国内可播率；
#   2026-10-25 复测原 host **6/6 全 200**）等于把「多线路」从**跨集群冗余**
#   压成**同集群同生共死** —— 正是主公实测「同一频道 3 条线同时死、同时活」的机制。
#   ⇒ V6 **保留每条线的原生 host + 原生 cdn**，多枚独立 token 自然分散到不同集群。
#
# 【实测限流特性（2026-10-24 全量对照实验 · 2026-10-25 修订）】
# 央视频有**两套互不相干的配额**，这是本 workflow 一切设计的根据：
#   ① **签发接口** bkliveinfo.ysp.cctv.cn —— 额度独立、**从不封**：
#      连发 80 次 80/80 全通（57ms/次）。
#   ② **CDN 取流侧** —— 按 (token × host) 计的额度 + 频道级突发保护。
# 关键教训：**主流程只签发、绝不碰 CDN**（63 频道仅 63 次签发调用，约 20 秒）；
#   交付前的任何「验活」都在消耗播放器的额度。
# 【为什么每频道挂多条线 · V6】
#   多条**完全同名同 tvg-id** 的线路会被播放器合并为一路的多个备选源，坏线自动换源。
#   V6 起备选线来自**多枚独立 token**，且各自保留**原生 host/cdn**
#   → 自然分散到不同边缘集群 = 真正的跨集群冗余。

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      defn:
        description: '清晰度档位（fhd=高清1080P / uhd=超高清，仅4K频道有效）。按军令只签高清，不提供标清/流畅。'
        required: false
        default: 'fhd'
      repeat:
        description: '每档挂几条同档线路（完全同名同 tvg-id，播放器自动合并换源）。V6 默认 2 —— 同频道 3 条会互争该频道取流额度。'
        required: false
        default: '2'
      sample:
        description: '抽样体检频道数（唯一会碰 CDN 的环节，用一次性 token，0=不体检）'
        required: false
        default: '2'
      channels:
        description: '只抓指定频道（逗号分隔，留空=全部）'
        required: false
        default: ''

jobs:
  fetch:
    name: 抓取央视频直播源 → cctv.m3u
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install --quiet requests urllib3

      - name: 抓取央视频直播源
        id: fetch
        env:
          DEFN: ${{ inputs.defn || 'fhd' }}
          REPEAT: ${{ inputs.repeat || '2' }}
          SAMPLE: ${{ inputs.sample || '2' }}
          CHANNELS: ${{ inputs.channels || '' }}
        run: |
          set -e
          cd cctv
          # 备份旧文件：全部失败时保留上一份不动
          if [ -f ../cctv.m3u ]; then
            cp ../cctv.m3u ../cctv.m3u.bak
          fi

          # 关键：--sample 是唯一会触碰 CDN 取流侧的参数，务必压到最小
          ARGS="--defn ${DEFN} --repeat ${REPEAT} --sample ${SAMPLE} --interval 0.3"
          if [ -n "${CHANNELS}" ]; then
            ARGS="${ARGS} --channels ${CHANNELS}"
          fi
          echo "参数: ${ARGS}"
          python3 fetch_cctv_m3u.py ${ARGS} --out ../cctv.m3u \
            || echo "::warning::签发返回非零（可能部分频道参数异常）"

          # 校验产物：必须是有效 m3u 且线路数达标
          if [ ! -s ../cctv.m3u ]; then
            echo "::error::cctv.m3u 未产出，恢复备份"
            if [ -f ../cctv.m3u.bak ]; then cp ../cctv.m3u.bak ../cctv.m3u; fi
            echo "changed=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          if ! grep -q "^#EXTM3U" ../cctv.m3u; then
            echo "::error::缺少 #EXTM3U 头，恢复备份"
            if [ -f ../cctv.m3u.bak ]; then cp ../cctv.m3u.bak ../cctv.m3u; fi
            echo "changed=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          NCH=$(grep -c '^#EXTINF' ../cctv.m3u || true)
          echo "有效线路数: ${NCH}"
          if [ "${NCH:-0}" -lt 20 ]; then
            echo "::warning::线路数 ${NCH} 偏少（可能央视频限流或接口异常）"
          fi
          rm -f ../cctv.m3u.bak
          echo "changed=true" >> $GITHUB_OUTPUT

      - name: 结果摘要
        if: always()
        run: |
          {
            echo "## 📺 央视频直播源抓取结果"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
          } >> $GITHUB_STEP_SUMMARY
          f="cctv.m3u"
          if [ -f "$f" ]; then
            sz=$(wc -c < "$f")
            cnt=$(grep -c '^#EXTINF' "$f" || true)
            last=$(git log -1 --date=short --format='%ad' -- "$f" 2>/dev/null || echo '未知')
            echo "| 文件 | $f |" >> $GITHUB_STEP_SUMMARY
            echo "| 大小 | $sz B |" >> $GITHUB_STEP_SUMMARY
            echo "| 线路数 | $cnt |" >> $GITHUB_STEP_SUMMARY
            echo "| 最近更新 | $last |" >> $GITHUB_STEP_SUMMARY
            ts=$(git log -1 --format=%ct -- "$f" 2>/dev/null || echo 0)
            hours=$(( ($(date +%s) - ${ts:-0}) / 3600 ))
            if [ "${hours:-999}" -ge 4 ]; then
              echo "::warning::$f 已 ${hours} 小时没有实质更新（央视频 token 寿命 4 小时），上游可能已失效"
            fi
          else
            echo "| 状态 | 未产出 |" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Commit and push
        if: steps.fetch.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add cctv.m3u

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          # 注意：提交信息切勿加 [skip ci] —— Cloudflare Pages 会据此跳过构建、
          # 导致站点不更新（此前 live.m3u 曾因此不部署）。
          git commit -m "chore: auto refresh cctv live sources"
          git push
